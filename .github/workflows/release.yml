name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          zip -r "founda-crm-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" "node_modules/*" ".next/*" ".opencode/*" ".vercel/*" "*.env*" ".env*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "founda-crm-*.zip"
          generate_release_notes: true
          name: "Founda CRM ${{ github.ref_name }}"
